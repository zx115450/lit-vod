server:
  port: 8082

spring:
  application:
    name: vod-worker
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:192.168.150.104}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:lite_vod}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  rabbitmq:
    host: ${RABBITMQ_HOST:192.168.150.104}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:root}
    password: ${RABBITMQ_PASSWORD:1234}
    listener:
      simple:
        # 手动 ack：成功、延迟重试入队、死信落库并入队之后才 ack
        acknowledge-mode: manual
        # 每 Worker 容器并发 1~2，避免 CPU 打满拖垮同机 API
        concurrency: ${WORKER_CONCURRENCY:1}
        # 监听器未 ack 就抛异常时立即重投，只兜底「延迟入队失败」
        default-requeue-rejected: true

minio:
  endpoint: ${MINIO_ENDPOINT:http://192.168.150.104:9000}
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://192.168.150.104:9000}
  access-key: ${MINIO_ROOT_USER:root}
  secret-key: ${MINIO_ROOT_PASSWORD:root1234}
  bucket: ${MINIO_BUCKET:vod}

worker:
  temp-dir: ${WORKER_TEMP_DIR:/tmp/vod}
  max-attempts: ${WORKER_MAX_ATTEMPTS:3}
  max-duration-sec: ${WORKER_MAX_DURATION_SEC:21600}
  concurrency: ${WORKER_CONCURRENCY:1}
  command:
    # 默认仅允许 ffmpeg / ffprobe；关闭 whitelist-enabled 仅用于本地排障/单测
    whitelist-enabled: true
    allowed-binaries:
      - ffmpeg
      - ffprobe
    max-output-chars: 65536

# ABR + Webhook 共用顶层 vod:（YAML 不允许重复 key，否则 Worker 启动直接失败）
vod:
  abr:
    enabled: ${VOD_ABR_ENABLED:true}
    # 渐进式多档：先出 fast-variant 档并标可播，再异步补齐其余档
    progressive-enabled: ${VOD_ABR_PROGRESSIVE_ENABLED:false}
    fast-variant: ${VOD_ABR_FAST_VARIANT:360p}
    fast-preset: ${VOD_ABR_FAST_PRESET:veryfast}
    ladder-preset: ${VOD_ABR_LADDER_PRESET:medium}
    # 档位示例（可覆盖）：
    # variants:
    #   - label: 360p
    #     height: 360
    #     video-bitrate: 600000
    #     audio-bitrate: 96000
    #     bandwidth: 800000
  # 试看 L2：转码后按上传方秒数写 preview.m3u8；关闭则跳过
  preview:
    l2-enabled: ${VOD_PREVIEW_L2_ENABLED:false}
    seconds: ${VOD_PREVIEW_SECONDS:30}
    max-seconds: ${VOD_PREVIEW_MAX_SECONDS:1800}
  # 步骤 13 Webhook：为空则跳过；书城切章回调示例 http://host.docker.internal:8081/api/internal/media/callback
  callback:
    url: ${VOD_CALLBACK_URL:}
    # 与书城 BOOKSTORE_MEDIA_TOKEN / 媒资 VOD_INTERNAL_TOKEN 对齐
    auth-token: ${VOD_CALLBACK_AUTH_TOKEN:${VOD_INTERNAL_TOKEN:}}
    connect-timeout-ms: ${VOD_CALLBACK_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${VOD_CALLBACK_READ_TIMEOUT_MS:3000}
    max-attempts: ${VOD_CALLBACK_MAX_ATTEMPTS:3}
    pool-core-size: ${VOD_CALLBACK_POOL_CORE:1}
    pool-max-size: ${VOD_CALLBACK_POOL_MAX:2}
    queue-capacity: ${VOD_CALLBACK_QUEUE_CAPACITY:200}
    keep-alive-seconds: ${VOD_CALLBACK_KEEP_ALIVE_SEC:60}

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.example.vod.common.domain.media

logging:
  level:
    com.example.vod.worker: info
