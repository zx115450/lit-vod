server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index player.html index.html index.htm;
    }

    # 业务 API
    location /vod/ {
        proxy_pass http://vod-api:8080/vod/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # auth_request 子请求：只验签，禁止浏览器直打
    location = /_auth {
        internal;
        proxy_pass http://vod-api:8080/internal/play-auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # 清单：验签后走 Java 改写（补 ts 的 e/exper/sign）
    location ~ ^/hls/.+\.m3u8$ {
        auth_request /_auth;
        proxy_pass http://vod-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 分片：验签后直反 MinIO（path-style：/hls/x → /vod/hls/x）
    location ~ ^/hls/.+\.ts$ {
        auth_request /_auth;
        rewrite ^/hls/(.*)$ /vod/hls/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
    }

    # 其它 /hls/ 资源（如封面旁路）同样验签后回源
    location /hls/ {
        auth_request /_auth;
        rewrite ^/hls/(.*)$ /vod/hls/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host minio:9000;
        proxy_hide_header x-amz-id-2;
        proxy_hide_header x-amz-request-id;
    }
}
